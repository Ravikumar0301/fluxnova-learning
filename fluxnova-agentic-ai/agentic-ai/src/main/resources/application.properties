# ----------------------------------
# Server
# ----------------------------------
server.port=8085

spring.application.name=agentic-ai

# ----------------------------------
# H2 Database (Required for Fluxnova BPM)
# ----------------------------------
spring.datasource.url=jdbc:h2:mem:fluxnova
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------
# Spring AI
# ----------------------------------
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5-mini

# ----------------------------------
# Actuator
# ----------------------------------
management.endpoints.web.exposure.include=health,info

# ----------------------------------
# Fluxnova BPM
# ----------------------------------
fluxnova.bpm.admin-user.id=demo
fluxnova.bpm.admin-user.password=demo